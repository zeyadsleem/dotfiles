<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Obsidian (وأي تطبيق Electron) يطلب خط "Inter" افتراضياً وهو غير منزّل.
       نوجّهه إلى IBM Plex Sans Arabic خط يدعم العربي والإنجليزي بنفس الهوية. -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Inter</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>IBM Plex Sans Arabic</string>
    </edit>
  </match>

  <!-- احتياط: أي خط عام sans-serif يعرض نص عربي يستخدم IBM Plex Sans Arabic أولاً -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans Arabic</family>
    </prefer>
  </alias>
</fontconfig>
