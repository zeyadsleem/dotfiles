# GTK settings for Noctalia dark mode. Written to gtk-3.0/settings.ini and
# gtk-4.0/settings.ini by the theme template. Minimal on purpose: new apps
# read this at startup, live updates come from the color-scheme portal.
[Settings]
gtk-theme-name=adw-gtk3
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=JetBrainsMono Nerd Font Medium 10
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=20
gtk-application-prefer-dark-theme=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
