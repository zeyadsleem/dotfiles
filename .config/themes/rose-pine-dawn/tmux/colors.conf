# === Colors (Rose Pine Dawn) ===
set -g status-style bg=default,fg=#575279
set -g pane-border-style fg=#cecacd
set -g pane-active-border-style fg=#d7827e
set -g message-style bg=default,fg=#575279
set -g message-command-style bg=default,fg=#575279
set -g mode-style bg=#d7827e,fg=#faf4f2

# === Status Bar ===
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 80

# Status Left with prefix indicator
set -g status-left "#[fg=#faf4f2,bg=#d7827e,bold]#{?client_prefix, 󰠠 , 󰄬 } #S #[fg=#d7827e,bg=default] "

# Status Right
set -g status-right "#[fg=#575279,bg=default]#(~/.local/bin/hijri-date.py) | #[fg=#d7827e,bg=default]%I:%M %p "

# Windows / Tabs
set -g window-status-format "#[fg=#9893a5,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#faf4f2,bg=#d7827e,bold] #I:#W "
set -g window-status-current-style bold
set -g window-status-separator ""
