# === Colors (Gruvbox Dark) ===
set -g status-style bg=default,fg=#ebdbb2
set -g pane-border-style fg=#504945
set -g pane-active-border-style fg=#fe8019
set -g message-style bg=default,fg=#ebdbb2
set -g message-command-style bg=default,fg=#ebdbb2
set -g mode-style bg=#fe8019,fg=#282828

# === Status Bar ===
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 80

# Status Left with prefix indicator
set -g status-left "#[fg=#282828,bg=#fe8019,bold]#{?client_prefix, 󰠠 , 󰄬 } #S #[fg=#fe8019,bg=default] "

# Status Right
set -g status-right "#[fg=#ebdbb2,bg=default]#(~/.local/bin/hijri-date.py) | #[fg=#fe8019,bg=default]%I:%M %p "

# Windows / Tabs
set -g window-status-format "#[fg=#928374,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#282828,bg=#fe8019,bold] #I:#W "
set -g window-status-current-style bold
set -g window-status-separator ""