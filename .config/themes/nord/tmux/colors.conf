# === Colors (Nord) ===
set -g status-style bg=default,fg=#d8dee9
set -g pane-border-style fg=#4c566a
set -g pane-active-border-style fg=#88c0d0
set -g message-style bg=default,fg=#d8dee9
set -g message-command-style bg=default,fg=#d8dee9
set -g mode-style bg=#88c0d0,fg=#2e3440

# === Status Bar ===
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 80

# Status Left with prefix indicator
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold]#{?client_prefix, 󰠠 , 󰄬 } #S #[fg=#88c0d0,bg=default] "

# Status Right
set -g status-right "#[fg=#d8dee9,bg=default]#(~/.local/bin/hijri-date.py) | #[fg=#88c0d0,bg=default]%I:%M %p "

# Windows / Tabs
set -g window-status-format "#[fg=#4c566a,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0,bold] #I:#W "
set -g window-status-current-style bold
set -g window-status-separator ""