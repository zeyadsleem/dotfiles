# Yazi Nord Theme

# : Manager {{{

[mgr]
cwd = { fg = "#88c0d0" }

# Hovered
hovered = { bg = "#88c0d0", fg = "#2e3440", bold = true }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "#88c0d0", bold = true, italic = true, underline = true }
find_position = { fg = "#d8dee9", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "#b48ead", italic = true }

# Marker
marker_copied = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut = { fg = "#bf616a", bg = "#bf616a" }
marker_marked = { fg = "#ebcb8b", bg = "#ebcb8b" }
marker_selected = { fg = "#88c0d0", bg = "#88c0d0" }

# Count
count_copied = { fg = "#2e3440", bg = "#a3be8c" }
count_cut = { fg = "#2e3440", bg = "#bf616a" }
count_selected = { fg = "#2e3440", bg = "#88c0d0" }

# Border
border_symbol = "│"
border_style = { fg = "#4c566a" }

# Highlighting
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#2e3440", bg = "#88c0d0", bold = true }
inactive = { fg = "#4c566a", bg = "#2e3440" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#2e3440", bg = "#88c0d0", bold = true }
normal_alt = { fg = "#88c0d0", bg = "#2e3440", bold = true }

# Select mode
select_main = { fg = "#2e3440", bg = "#a3be8c", bold = true }
select_alt = { fg = "#a3be8c", bg = "#2e3440", bold = true }

# Unset mode
unset_main = { fg = "#2e3440", bg = "#bf616a", bold = true }
unset_alt = { fg = "#bf616a", bg = "#2e3440", bold = true }

# : }}}


# : Status bar {{{

[status]
overall = { bg = "#2e3440", fg = "#d8dee9" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep = { fg = "#4c566a" }
perm_type = { fg = "#88c0d0" }
perm_read = { fg = "#ebcb8b" }
perm_write = { fg = "#bf616a" }
perm_exec = { fg = "#a3be8c" }

# Progress
progress_label = { fg = "#d8dee9", bold = true }
progress_normal = { fg = "#88c0d0", bg = "#3b4252" }
progress_error = { fg = "#bf616a", bg = "#3b4252" }

# : }}}


# : Which {{{

[which]
cols = 3
mask = { bg = "#2e3440" }
cand = { fg = "#88c0d0" }
rest = { fg = "#4c566a" }
desc = { fg = "#b48ead" }
separator = "  "
separator_style = { fg = "#4c566a" }

# : }}}


# : Confirmation {{{

[confirm]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0", bold = true }
body = { fg = "#d8dee9" }
list = { fg = "#d8dee9" }
btn_yes = { fg = "#2e3440", bg = "#88c0d0", bold = true }
btn_no = { fg = "#d8dee9", bg = "#4c566a", bold = true }
btn_labels = ["  [y]es  ", "  (n)o  "]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0", bold = true }

# Table
tbl_col = { fg = "#88c0d0" }
tbl_cell = { fg = "#d8dee9", bg = "#3b4252", bold = true }

# : }}}


# : Notification {{{

[notify]
title_info = { fg = "#a3be8c" }
title_warn = { fg = "#ebcb8b" }
title_error = { fg = "#bf616a" }


# : }}}


# : Picker {{{

[pick]
border = { fg = "#88c0d0" }
active = { fg = "#88c0d0", bold = true }
inactive = { fg = "#4c566a" }

# : }}}


# : Input {{{

[input]
border = { fg = "#88c0d0" }
title = { bold = true }
value = { fg = "#d8dee9" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#88c0d0" }
active = { bg = "#88c0d0", fg = "#2e3440", bold = true }
inactive = { fg = "#4c566a" }


# : }}}


# : Task manager {{{

[tasks]
border = { fg = "#88c0d0" }
title = { bold = true }
hovered = { fg = "#88c0d0", bold = true, reversed = true }

# : }}}


# : Help menu {{{

[help]
on = { fg = "#88c0d0" }
run = { fg = "#b48ead" }
desc = { fg = "#d8dee9" }
hovered = { reversed = true, bold = true }
footer = { fg = "#d8dee9", bg = "#2e3440" }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#81a1c1" },

  # Media
  { mime = "{audio,video}/*", fg = "#ebcb8b" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bf616a" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#d8dee9" },
]

# : }}}
