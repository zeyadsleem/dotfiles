# Yazi Tokyo Night Theme

# : Manager {{{

[mgr]
cwd = { fg = "#7aa2f7" }

# Hovered
hovered = { bg = "#7aa2f7", fg = "#1a1b26", bold = true }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "#7aa2f7", bold = true, italic = true, underline = true }
find_position = { fg = "#c0caf5", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "#7dcfff", italic = true }

# Marker
marker_copied = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut = { fg = "#f7768e", bg = "#f7768e" }
marker_marked = { fg = "#e0af68", bg = "#e0af68" }
marker_selected = { fg = "#7aa2f7", bg = "#7aa2f7" }

# Count
count_copied = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut = { fg = "#1a1b26", bg = "#f7768e" }
count_selected = { fg = "#1a1b26", bg = "#7aa2f7" }

# Border
border_symbol = "│"
border_style = { fg = "#565f89" }

# Highlighting
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
inactive = { fg = "#565f89", bg = "#1a1b26" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
normal_alt = { fg = "#7aa2f7", bg = "#1a1b26", bold = true }

# Select mode
select_main = { fg = "#1a1b26", bg = "#9ece6a", bold = true }
select_alt = { fg = "#9ece6a", bg = "#1a1b26", bold = true }

# Unset mode
unset_main = { fg = "#1a1b26", bg = "#f7768e", bold = true }
unset_alt = { fg = "#f7768e", bg = "#1a1b26", bold = true }

# : }}}


# : Status bar {{{

[status]
overall = { bg = "#1a1b26", fg = "#c0caf5" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep = { fg = "#565f89" }
perm_type = { fg = "#7aa2f7" }
perm_read = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec = { fg = "#9ece6a" }

# Progress
progress_label = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#292e42" }
progress_error = { fg = "#f7768e", bg = "#292e42" }

# : }}}


# : Which {{{

[which]
cols = 3
mask = { bg = "#1a1b26" }
cand = { fg = "#7aa2f7" }
rest = { fg = "#565f89" }
desc = { fg = "#7dcfff" }
separator = "  "
separator_style = { fg = "#565f89" }

# : }}}


# : Confirmation {{{

[confirm]
border = { fg = "#7aa2f7" }
title = { fg = "#7aa2f7", bold = true }
body = { fg = "#c0caf5" }
list = { fg = "#c0caf5" }
btn_yes = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
btn_no = { fg = "#c0caf5", bg = "#565f89", bold = true }
btn_labels = ["  [y]es  ", "  (n)o  "]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#7aa2f7" }
title = { fg = "#7aa2f7", bold = true }

# Table
tbl_col = { fg = "#7aa2f7" }
tbl_cell = { fg = "#c0caf5", bg = "#292e42", bold = true }

# : }}}


# : Notification {{{

[notify]
title_info = { fg = "#9ece6a" }
title_warn = { fg = "#e0af68" }
title_error = { fg = "#f7768e" }


# : }}}


# : Picker {{{

[pick]
border = { fg = "#7aa2f7" }
active = { fg = "#7aa2f7", bold = true }
inactive = { fg = "#565f89" }

# : }}}


# : Input {{{

[input]
border = { fg = "#7aa2f7" }
title = { bold = true }
value = { fg = "#c0caf5" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#7aa2f7" }
active = { bg = "#7aa2f7", fg = "#1a1b26", bold = true }
inactive = { fg = "#565f89" }


# : }}}


# : Task manager {{{

[tasks]
border = { fg = "#7aa2f7" }
title = { bold = true }
hovered = { fg = "#7aa2f7", bold = true, reversed = true }

# : }}}


# : Help menu {{{

[help]
on = { fg = "#7aa2f7" }
run = { fg = "#7dcfff" }
desc = { fg = "#c0caf5" }
hovered = { reversed = true, bold = true }
footer = { fg = "#c0caf5", bg = "#1a1b26" }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#bb9af7" },

  # Media
  { mime = "{audio,video}/*", fg = "#e0af68" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f7768e" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#c0caf5" },
]

# : }}}
