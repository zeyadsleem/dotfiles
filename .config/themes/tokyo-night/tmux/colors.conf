# === Colors (Tokyo Night) ===
set -g status-style bg=default,fg=#c0caf5
set -g pane-border-style fg=#565f89
set -g pane-active-border-style fg=#7aa2f7
set -g message-style bg=default,fg=#c0caf5
set -g message-command-style bg=default,fg=#c0caf5
set -g mode-style bg=#7aa2f7,fg=#1a1b26

# === Status Bar ===
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 80

# Status Left with prefix indicator
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold]#{?client_prefix, 󰠠 , 󰄬 } #S #[fg=#7aa2f7,bg=default] "

# Status Right
set -g status-right "#[fg=#c0caf5,bg=default]#(~/.local/bin/hijri-date.py) | #[fg=#7aa2f7,bg=default]%I:%M %p "

# Windows / Tabs
set -g window-status-format "#[fg=#565f89,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W "
set -g window-status-current-style bold
set -g window-status-separator ""