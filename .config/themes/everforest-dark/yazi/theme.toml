# Yazi Everforest Dark Theme

# : Manager {{{

[mgr]
cwd = { fg = "#a7c080" }

# Hovered
hovered = { bg = "#a7c080", fg = "#2d353b", bold = true }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "#a7c080", bold = true, italic = true, underline = true }
find_position = { fg = "#d3c6aa", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "#7fbbb3", italic = true }

# Marker
marker_copied = { fg = "#a7c080", bg = "#a7c080" }
marker_cut = { fg = "#e67e80", bg = "#e67e80" }
marker_marked = { fg = "#dbbc7f", bg = "#dbbc7f" }
marker_selected = { fg = "#a7c080", bg = "#a7c080" }

# Count
count_copied = { fg = "#2d353b", bg = "#a7c080" }
count_cut = { fg = "#2d353b", bg = "#e67e80" }
count_selected = { fg = "#2d353b", bg = "#a7c080" }

# Border
border_symbol = "│"
border_style = { fg = "#859289" }

# Highlighting
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#2d353b", bg = "#a7c080", bold = true }
inactive = { fg = "#859289", bg = "#2d353b" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#2d353b", bg = "#a7c080", bold = true }
normal_alt = { fg = "#a7c080", bg = "#2d353b", bold = true }

# Select mode
select_main = { fg = "#2d353b", bg = "#a7c080", bold = true }
select_alt = { fg = "#a7c080", bg = "#2d353b", bold = true }

# Unset mode
unset_main = { fg = "#2d353b", bg = "#e67e80", bold = true }
unset_alt = { fg = "#e67e80", bg = "#2d353b", bold = true }

# : }}}


# : Status bar {{{

[status]
overall = { bg = "#2d353b", fg = "#d3c6aa" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep = { fg = "#859289" }
perm_type = { fg = "#a7c080" }
perm_read = { fg = "#dbbc7f" }
perm_write = { fg = "#e67e80" }
perm_exec = { fg = "#a7c080" }

# Progress
progress_label = { fg = "#d3c6aa", bold = true }
progress_normal = { fg = "#a7c080", bg = "#343f44" }
progress_error = { fg = "#e67e80", bg = "#343f44" }

# : }}}


# : Which {{{

[which]
cols = 3
mask = { bg = "#2d353b" }
cand = { fg = "#a7c080" }
rest = { fg = "#859289" }
desc = { fg = "#7fbbb3" }
separator = "  "
separator_style = { fg = "#859289" }

# : }}}


# : Confirmation {{{

[confirm]
border = { fg = "#a7c080" }
title = { fg = "#a7c080", bold = true }
body = { fg = "#d3c6aa" }
list = { fg = "#d3c6aa" }
btn_yes = { fg = "#2d353b", bg = "#a7c080", bold = true }
btn_no = { fg = "#d3c6aa", bg = "#859289", bold = true }
btn_labels = ["  [y]es  ", "  (n)o  "]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#a7c080" }
title = { fg = "#a7c080", bold = true }

# Table
tbl_col = { fg = "#a7c080" }
tbl_cell = { fg = "#d3c6aa", bg = "#343f44", bold = true }

# : }}}


# : Notification {{{

[notify]
title_info = { fg = "#a7c080" }
title_warn = { fg = "#dbbc7f" }
title_error = { fg = "#e67e80" }


# : }}}


# : Picker {{{

[pick]
border = { fg = "#a7c080" }
active = { fg = "#a7c080", bold = true }
inactive = { fg = "#859289" }

# : }}}


# : Input {{{

[input]
border = { fg = "#a7c080" }
title = { bold = true }
value = { fg = "#d3c6aa" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#a7c080" }
active = { bg = "#a7c080", fg = "#2d353b", bold = true }
inactive = { fg = "#859289" }


# : }}}


# : Task manager {{{

[tasks]
border = { fg = "#a7c080" }
title = { bold = true }
hovered = { fg = "#a7c080", bold = true, reversed = true }

# : }}}


# : Help menu {{{

[help]
on = { fg = "#a7c080" }
run = { fg = "#7fbbb3" }
desc = { fg = "#d3c6aa" }
hovered = { reversed = true, bold = true }
footer = { fg = "#d3c6aa", bg = "#2d353b" }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#dbbc7f" },

  # Media
  { mime = "{audio,video}/*", fg = "#dbbc7f" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e67e80" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#d3c6aa" },
]

# : }}}
