# === Colors (Everforest Dark) ===
set -g status-style bg=default,fg=#d3c6aa
set -g pane-border-style fg=#859289
set -g pane-active-border-style fg=#a7c080
set -g message-style bg=default,fg=#d3c6aa
set -g message-command-style bg=default,fg=#d3c6aa
set -g mode-style bg=#a7c080,fg=#2d353b

# === Status Bar ===
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 80

# Status Left with prefix indicator
set -g status-left "#[fg=#2d353b,bg=#a7c080,bold]#{?client_prefix, 󰠠 , 󰄬 } #S #[fg=#a7c080,bg=default] "

# Status Right
set -g status-right "#[fg=#d3c6aa,bg=default]#(~/.local/bin/hijri-date.py) | #[fg=#a7c080,bg=default]%I:%M %p "

# Windows / Tabs
set -g window-status-format "#[fg=#859289,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#2d353b,bg=#a7c080,bold] #I:#W "
set -g window-status-current-style bold
set -g window-status-separator ""