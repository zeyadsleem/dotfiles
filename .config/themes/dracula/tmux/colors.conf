# === Colors (Dracula) ===
set -g status-style bg=default,fg=#f8f8f2
set -g pane-border-style fg=#6272a4
set -g pane-active-border-style fg=#bd93f9
set -g message-style bg=default,fg=#f8f8f2
set -g message-command-style bg=default,fg=#f8f8f2
set -g mode-style bg=#bd93f9,fg=#282a36

# === Status Bar ===
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 80

# Status Left with prefix indicator
set -g status-left "#[fg=#282a36,bg=#bd93f9,bold]#{?client_prefix, 󰠠 , 󰄬 } #S #[fg=#bd93f9,bg=default] "

# Status Right
set -g status-right "#[fg=#f8f8f2,bg=default]#(~/.local/bin/hijri-date.py) | #[fg=#bd93f9,bg=default]%I:%M %p "

# Windows / Tabs
set -g window-status-format "#[fg=#6272a4,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#282a36,bg=#bd93f9,bold] #I:#W "
set -g window-status-current-style bold
set -g window-status-separator ""