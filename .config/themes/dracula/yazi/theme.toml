# Yazi Dracula Theme

# : Manager {{{

[mgr]
cwd = { fg = "#bd93f9" }

# Hovered
hovered = { bg = "#bd93f9", fg = "#282a36", bold = true }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "#bd93f9", bold = true, italic = true, underline = true }
find_position = { fg = "#f8f8f2", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "#8be9fd", italic = true }

# Marker
marker_copied = { fg = "#50fa7b", bg = "#50fa7b" }
marker_cut = { fg = "#ff5555", bg = "#ff5555" }
marker_marked = { fg = "#f1fa8c", bg = "#f1fa8c" }
marker_selected = { fg = "#bd93f9", bg = "#bd93f9" }

# Count
count_copied = { fg = "#282a36", bg = "#50fa7b" }
count_cut = { fg = "#282a36", bg = "#ff5555" }
count_selected = { fg = "#282a36", bg = "#bd93f9" }

# Border
border_symbol = "│"
border_style = { fg = "#6272a4" }

# Highlighting
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#282a36", bg = "#bd93f9", bold = true }
inactive = { fg = "#6272a4", bg = "#282a36" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#282a36", bg = "#bd93f9", bold = true }
normal_alt = { fg = "#bd93f9", bg = "#282a36", bold = true }

# Select mode
select_main = { fg = "#282a36", bg = "#50fa7b", bold = true }
select_alt = { fg = "#50fa7b", bg = "#282a36", bold = true }

# Unset mode
unset_main = { fg = "#282a36", bg = "#ff5555", bold = true }
unset_alt = { fg = "#ff5555", bg = "#282a36", bold = true }

# : }}}


# : Status bar {{{

[status]
overall = { bg = "#282a36", fg = "#f8f8f2" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep = { fg = "#6272a4" }
perm_type = { fg = "#bd93f9" }
perm_read = { fg = "#f1fa8c" }
perm_write = { fg = "#ff5555" }
perm_exec = { fg = "#50fa7b" }

# Progress
progress_label = { fg = "#f8f8f2", bold = true }
progress_normal = { fg = "#bd93f9", bg = "#44475a" }
progress_error = { fg = "#ff5555", bg = "#44475a" }

# : }}}


# : Which {{{

[which]
cols = 3
mask = { bg = "#282a36" }
cand = { fg = "#bd93f9" }
rest = { fg = "#6272a4" }
desc = { fg = "#8be9fd" }
separator = "  "
separator_style = { fg = "#6272a4" }

# : }}}


# : Confirmation {{{

[confirm]
border = { fg = "#bd93f9" }
title = { fg = "#bd93f9", bold = true }
body = { fg = "#f8f8f2" }
list = { fg = "#f8f8f2" }
btn_yes = { fg = "#282a36", bg = "#bd93f9", bold = true }
btn_no = { fg = "#f8f8f2", bg = "#6272a4", bold = true }
btn_labels = ["  [y]es  ", "  (n)o  "]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#bd93f9" }
title = { fg = "#bd93f9", bold = true }

# Table
tbl_col = { fg = "#bd93f9" }
tbl_cell = { fg = "#f8f8f2", bg = "#44475a", bold = true }

# : }}}


# : Notification {{{

[notify]
title_info = { fg = "#50fa7b" }
title_warn = { fg = "#f1fa8c" }
title_error = { fg = "#ff5555" }


# : }}}


# : Picker {{{

[pick]
border = { fg = "#bd93f9" }
active = { fg = "#bd93f9", bold = true }
inactive = { fg = "#6272a4" }

# : }}}


# : Input {{{

[input]
border = { fg = "#bd93f9" }
title = { bold = true }
value = { fg = "#f8f8f2" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#bd93f9" }
active = { bg = "#bd93f9", fg = "#282a36", bold = true }
inactive = { fg = "#6272a4" }


# : }}}


# : Task manager {{{

[tasks]
border = { fg = "#bd93f9" }
title = { bold = true }
hovered = { fg = "#bd93f9", bold = true, reversed = true }

# : }}}


# : Help menu {{{

[help]
on = { fg = "#bd93f9" }
run = { fg = "#8be9fd" }
desc = { fg = "#f8f8f2" }
hovered = { reversed = true, bold = true }
footer = { fg = "#f8f8f2", bg = "#282a36" }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#ff79c6" },

  # Media
  { mime = "{audio,video}/*", fg = "#f1fa8c" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff5555" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#f8f8f2" },
]

# : }}}
