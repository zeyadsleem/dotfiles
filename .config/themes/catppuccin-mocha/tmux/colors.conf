# === Colors (Catppuccin Mocha) ===
set -g status-style bg=default,fg=#cdd6f4
set -g pane-border-style fg=#45475a
set -g pane-active-border-style fg=#cba6f7
set -g message-style bg=default,fg=#cdd6f4
set -g message-command-style bg=default,fg=#cdd6f4
set -g mode-style bg=#cba6f7,fg=#1e1e2e

# === Status Bar ===
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 80

# Status Left with prefix indicator
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold]#{?client_prefix, 󰠠 , 󰄬 } #S #[fg=#cba6f7,bg=default] "

# Status Right
set -g status-right "#[fg=#cdd6f4,bg=default]#(~/.local/bin/hijri-date.py) | #[fg=#cba6f7,bg=default]%I:%M %p "

# Windows / Tabs
set -g window-status-format "#[fg=#7f849c,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W "
set -g window-status-current-style bold
set -g window-status-separator ""