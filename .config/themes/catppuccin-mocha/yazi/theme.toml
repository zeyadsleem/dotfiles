# Yazi Catppuccin Mocha Theme

# : Manager {{{

[mgr]
cwd = { fg = "#cba6f7" }

# Hovered
hovered = { bg = "#cba6f7", fg = "#1e1e2e", bold = true }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "#cba6f7", bold = true, italic = true, underline = true }
find_position = { fg = "#cdd6f4", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "#94e2d5", italic = true }

# Marker
marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#f9e2af", bg = "#f9e2af" }
marker_selected = { fg = "#cba6f7", bg = "#cba6f7" }

# Count
count_copied = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#cba6f7" }

# Border
border_symbol = "│"
border_style = { fg = "#45475a" }

# Highlighting
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
inactive = { fg = "#7f849c", bg = "#1e1e2e" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
normal_alt = { fg = "#cba6f7", bg = "#1e1e2e", bold = true }

# Select mode
select_main = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
select_alt = { fg = "#a6e3a1", bg = "#1e1e2e", bold = true }

# Unset mode
unset_main = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }
unset_alt = { fg = "#f38ba8", bg = "#1e1e2e", bold = true }

# : }}}


# : Status bar {{{

[status]
overall = { bg = "#1e1e2e", fg = "#cdd6f4" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep = { fg = "#45475a" }
perm_type = { fg = "#cba6f7" }
perm_read = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec = { fg = "#a6e3a1" }

# Progress
progress_label = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#cba6f7", bg = "#313244" }
progress_error = { fg = "#f38ba8", bg = "#313244" }

# : }}}


# : Which {{{

[which]
cols = 3
mask = { bg = "#1e1e2e" }
cand = { fg = "#cba6f7" }
rest = { fg = "#7f849c" }
desc = { fg = "#94e2d5" }
separator = "  "
separator_style = { fg = "#45475a" }

# : }}}


# : Confirmation {{{

[confirm]
border = { fg = "#cba6f7" }
title = { fg = "#cba6f7", bold = true }
body = { fg = "#cdd6f4" }
list = { fg = "#cdd6f4" }
btn_yes = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
btn_no = { fg = "#cdd6f4", bg = "#45475a", bold = true }
btn_labels = ["  [y]es  ", "  (n)o  "]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#cba6f7" }
title = { fg = "#cba6f7", bold = true }

# Table
tbl_col = { fg = "#cba6f7" }
tbl_cell = { fg = "#cdd6f4", bg = "#313244", bold = true }

# : }}}


# : Notification {{{

[notify]
title_info = { fg = "#a6e3a1" }
title_warn = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }


# : }}}


# : Picker {{{

[pick]
border = { fg = "#cba6f7" }
active = { fg = "#cba6f7", bold = true }
inactive = { fg = "#7f849c" }

# : }}}


# : Input {{{

[input]
border = { fg = "#cba6f7" }
title = { bold = true }
value = { fg = "#cdd6f4" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#cba6f7" }
active = { bg = "#cba6f7", fg = "#1e1e2e", bold = true }
inactive = { fg = "#7f849c" }


# : }}}


# : Task manager {{{

[tasks]
border = { fg = "#cba6f7" }
title = { bold = true }
hovered = { fg = "#cba6f7", bold = true, reversed = true }

# : }}}


# : Help menu {{{

[help]
on = { fg = "#cba6f7" }
run = { fg = "#94e2d5" }
desc = { fg = "#cdd6f4" }
hovered = { reversed = true, bold = true }
footer = { fg = "#cdd6f4", bg = "#1e1e2e" }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#cba6f7" },

  # Media
  { mime = "{audio,video}/*", fg = "#f9e2af" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f38ba8" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#cdd6f4" },
]

# : }}}
